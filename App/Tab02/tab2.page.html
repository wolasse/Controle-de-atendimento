
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Painel Atendente</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Chamar Próxima Senha</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-button expand="block" color="warning" (click)="chamarProxima()">
         CHAMAR PRÓXIMA SENHA
      </ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Guichês -->
  <ion-grid>
    <ion-row>
      <ion-col size="4" *ngFor="let guiche of guiches$ | async">
        <ion-card [color]="guiche.ocupado ? 'danger' : 'success'">
          <ion-card-header>
            <ion-card-subtitle>{{guiche.nome}}</ion-card-subtitle>
            <ion-card-title [class.ocupado]="guiche.ocupado">
              {{guiche.ocupado ? 'OCUPADO' : 'LIVRE'}}
            </ion-card-title>
          </ion-card-header>
          <ion-card-content *ngIf="guiche.senhaAtual">
            <strong>{{guiche.senhaAtual.numero}}</strong>
            <p>TM: {{guiche.senhaAtual.tempoAtendimento | number:'1.0-0'}} min</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Últimas 5 chamadas -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Últimas 5 Chamadas</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item *ngFor="let senha of ultimasChamadas$ | async">
        <ion-icon name="radio-button-on" slot="start" [color]="senha.tipo === 'SP' ? 'danger' : senha.tipo === 'SE' ? 'success' : 'medium'"></ion-icon>
        <ion-label>{{senha.numero}} → {{senha.guiche}}</ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>
</ion-content>
